<form [formGroup]="calendarOptionsForm" class="mobile-home">
  <div class="calendar-filters">
    <app-dropdown
      label="CLASSES.FILTER_BY_LOCATION"
      [options]="calendarLocationOptions"
      [formatOption]="FormatOptions.TRANSLATE"
      [showValidation]="false"
      controlName="calendarView">
    </app-dropdown>

    <app-dropdown
      label="CLASSES.FILTER_BY_TYPE"
      [options]="calendarClassTypeOptions"
      [formatOption]="FormatOptions.TRANSLATE"
      [showValidation]="false"
      controlName="classType">
    </app-dropdown>
  </div>

  <app-mobile-class-calendar
    [location]="selectedLocation"
    [classType]="selectedClassType">
  </app-mobile-class-calendar>
</form>

<div *ngIf="client" class="enroll-container">
  <div *ngIf="panelView" class="panel-view-header">
    <h2 class="light-blue">{{ 'CLIENTS.ENROLL' | translate }}</h2>
  </div>

  <div class="enroll-content">
    <p>{{ 'CLIENTS.ENROLL_INSTRUCTIONS' | translate }}</p>
    <h5>{{ client.firstName }} {{ client.lastName }}</h5>

    <form [formGroup]="enrollmentForm" class="enroll-form">
      <app-dropdown
        *ngIf="classTypeOptions.length"
        label="CONTROLS.CLASS_TYPE"
        [options]="classTypeOptions"
        [i18nPrefix]="'CLASS_TYPES'"
        controlName="class_type">
      </app-dropdown>
      <app-dropdown
        label="CONTROLS.LOCATION"
        [options]="classLocationOptions"
        controlName="location"
        [disabled]="!selectedType">
      </app-dropdown>
      <app-dropdown
        label="CONTROLS.TIME"
        [options]="classTimesOptions"
        controlName="time"
        [disabled]="!selectedType || !selectedLocation">
      </app-dropdown>
      <app-datepicker
        label="CONTROLS.START_DATE"
        controlName="start_date"
        [disabled]="!selectedClassId"
        [allowedWeekdays]="advancedOptionsClassInfo?.days">
      </app-datepicker>

      <mat-expansion-panel
        [disabled]="!selectedClassId"
        (opened)="onAdvancedOptionsOpened()">
        <mat-expansion-panel-header>
          {{ 'ENROLLMENTS.ADVANCED_OPTIONS' | translate }}
        </mat-expansion-panel-header>

        <ng-template matExpansionPanelContent>
          <app-multi-select-chips
            *ngIf="advancedOptionsClassInfo && advancedOptionsClassInfo.days.length > 1"
            label="CONTROLS.DAYS_OVERRIDE"
            [options]="weekdays"
            [disabledChipsIndices]="disabledDaysChips"
            i18nPrefix="WEEKDAYS_SHORT"
            controlName="days_override">
          </app-multi-select-chips>
          <app-dropdown
            label="CONTROLS.BILLING_FREQUENCY_OVERRIDE"
            [options]="billingFrequencyOptions"
            controlName="billing_frequency_override"
            [i18nPrefix]="'BILLING_FREQUENCY'"
            [hasNoSelectOption]="true"
            class="billing-frequency">
          </app-dropdown>
        </ng-template>
      </mat-expansion-panel>
    </form>

    <div class="flex-row buttons">
      <app-button
        [label]="'CONTROLS.CANCEL'"
        (onClick)="cancel()">
      </app-button>
      <app-button
        [label]="'CLIENTS.ENROLL'"
        [loading]="loading"
        [loadingMessage]="'CONTROLS.SUBMIT_WAIT_MESSAGE'"
        [disabled]="!enrollmentForm.valid"
        (onClick)="submit()">
      </app-button>
    </div>
  </div>
</div>

<div class="three-panel-layout">
  <section class="panel panel-1">
    <div class="panel-body">
      <app-class-list
        [showBreadcrumb]="false"
        [panelView]="true">
      </app-class-list>
    </div>
  </section>
  <section class="panel panel-2">
    <div class="panel-body">
      <router-outlet></router-outlet>
    </div>
  </section>
  <section class="panel panel-3">
    <div class="panel-body">
      <app-class-enroll
        *ngIf="showEnrollPanel && activeClassId"
        [classId]="activeClassId"
        [panelView]="true">
      </app-class-enroll>
      <app-invoice-history
        *ngIf="showInvoiceHistoryPanel && activeClassId && activeUserId && activeEnrollmentId"
        [classId]="activeClassId"
        [userId]="activeUserId"
        [enrollmentId]="activeEnrollmentId"
        [panelView]="true">
      </app-invoice-history>
      <app-invoice-details
        *ngIf="showInvoiceDetailsPanel && activeUserId && activeEnrollmentId && activeInvoiceId"
        [userId]="activeUserId"
        [enrollmentId]="activeEnrollmentId"
        [invoiceId]="activeInvoiceId"
        [panelView]="true">
      </app-invoice-details>
    </div>
  </section>
</div>

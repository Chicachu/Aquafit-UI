<ng-template #itemTemplate let-classItem>
  <div
    class="class-bubble"
    [style.background-color]="classItem?.backgroundColor || '#757575'"
    [style.color]="classItem?.textColor || '#FFFFFF'"
    (click)="goToClassDetails(classItem?._id)"
    role="button"
    tabindex="0"
    (keydown.enter)="goToClassDetails(classItem?._id)"
    (keydown.space)="goToClassDetails(classItem?._id); $event.preventDefault()">
    <span class="class-bubble-label">
      {{ 'CLASS_TYPES.' + (classItem?.classType || '') | translate | capitalize }}
    </span>
    <span *ngIf="canViewPayments" class="payment-status-icons">
      <span
        *ngIf="hasAlmostDuePayments(classItem?._id)"
        class="icon almost-due-status-icon calendar-payment-icon"
        [attr.title]="'PAYMENT_STATUS.ALMOST_DUE' | translate">
      </span>
      <span
        *ngIf="hasOverduePayments(classItem?._id)"
        class="icon overdue-status-icon calendar-payment-icon"
        [attr.title]="'PAYMENT_STATUS.OVERDUE' | translate">
      </span>
    </span>
  </div>
</ng-template>

<div class="calendar-wrapper" [class.loading]="isLoading">
  <app-desktop-week-calendar
    [hours]="HOURS_IN_WORKDAY"
    [scheduleByDay]="scheduleByDay"
    [legendItems]="legendItems"
    [showLegend]="location === '' && locations.length > 0"
    [itemTemplate]="itemTemplate"
    [initialDate]="currentDate"
    (dateChange)="onDateChange($any($event))">
  </app-desktop-week-calendar>

  <div class="loading-overlay" *ngIf="isLoading">
    <div class="spinner"></div>
  </div>
</div>

<div class="week-calendar">
  <div class="week-navigation">
    <button class="nav-arrow" (click)="previousWeek()" aria-label="Previous week">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <span class="week-label">{{ getWeekLabel() }}</span>
    <button class="nav-arrow" (click)="nextWeek()" aria-label="Next week">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <div class="location-legend" *ngIf="showLegend && legendItems.length > 0">
    <div class="legend-item" *ngFor="let legendItem of legendItems">
      <div class="legend-color-box" [style.background-color]="legendItem.color"></div>
      <span class="legend-text">{{ legendItem.label }}</span>
    </div>
  </div>

  <div class="week-view">
    <div class="day-headers">
      <div
        class="day-header"
        *ngFor="let day of weekDays"
        [class.today]="isToday(day)">
        {{ getDayHeader(day) }}
      </div>
    </div>

    <div class="hour-rows">
      <div
        class="hour-row"
        *ngFor="let hour of hours; let isLastHour = last">
        <div
          class="hour-cell"
          *ngFor="let day of weekDays"
          [class.today-column]="isToday(day)"
          [class.last-hour-row]="isLastHour">
          <app-calendar-hour-slot
            [hour]="hour"
            [items]="getItemsForDayHour(day, hour)"
            [itemTemplate]="itemTemplate"
            [emptyTemplate]="emptyTemplate"
            [stackItems]="true">
          </app-calendar-hour-slot>
        </div>
      </div>
    </div>
  </div>
</div>
